# The workflow/ stages are standard-library Python with an offline test suite. They are
# not part of the R package build, so R CMD check never sees them. Without this job the
# tests only ever run on one machine.
#
# The suite needs no QIIME 2, no conda and no network: QIIME 2 is replaced by fake
# runners, and every fixture is either checked in or built in the test. That is why it
# can run here at all, and it is worth keeping true.
name: workflow-tests

on:
  push:
    paths:
      - 'workflow/**'
      - '.github/workflows/workflow-tests.yaml'
      - 'DESCRIPTION'
      - 'README.md'
  pull_request:
    paths:
      - 'workflow/**'
      - '.github/workflows/workflow-tests.yaml'
      - 'DESCRIPTION'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The stages claim Python 3.8 or later, so the oldest supported version is
        # tested as well as a current one. A claim nobody checks is a guess.
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Confirm the stages import with no third-party packages
        run: |
          python - <<'PY'
          import importlib.util, pathlib, sys
          sys.path.insert(0, "workflow")
          for path in sorted(pathlib.Path("workflow").glob("*.py")):
              spec = importlib.util.spec_from_file_location(path.stem, path)
              module = importlib.util.module_from_spec(spec)
              sys.modules[path.stem] = module
              spec.loader.exec_module(module)
              print(f"ok {path.name}")
          PY

      - name: Run the workflow tests
        run: python -m pytest workflow/tests -q

  # The job above has no Snakemake, so the dry-run and rulegraph tests in
  # test_snakefile.py skip there. This job runs them against the Snakemake the workflow
  # actually uses: versions from workflow/envs/amplipub-snakemake.lock (Python 3.12,
  # snakemake-minimal 9.26.1, PyYAML 6.0.3, jsonschema 4.26.0). Snakemake 9 needs
  # Python 3.11 or later, hence not in the matrix above.
  snakefile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Snakemake and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install snakemake==9.26.1 PyYAML==6.0.3 jsonschema==4.26.0 pytest
          snakemake --version

      # A skip here would be a silent pass, so any skip fails the job.
      - name: Run the Snakefile tests, refusing skips
        run: |
          python -m pytest workflow/tests/test_snakefile.py -q -rs | tee pytest.log
          if grep -qi skipped pytest.log; then
            echo "::error::a Snakefile test was skipped"; exit 1
          fi
